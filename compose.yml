services:

  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "${WAHA_PORT:-3000}:3000"
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-waha}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:-waha}
      WHATSAPP_SWAGGER_USERNAME: ${WHATSAPP_SWAGGER_USERNAME:-waha}
      WHATSAPP_SWAGGER_PASSWORD: ${WHATSAPP_SWAGGER_PASSWORD:-waha}
      # Service name, not localhost: waha calls the bot inside the compose network.
      WHATSAPP_HOOK_URL: http://bot:8000/webhook
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_HMAC_KEY: ${WEBHOOK_SECRET:-}
      WHATSAPP_RESTART_ALL_SESSIONS: "True"
    volumes:
      # Without this the QR has to be scanned again on every restart.
      - ./.waha_sessions:/app/.sessions

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Override the localhost defaults, inside the network services have names.
      WAHA_URL: http://waha:3000
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${BOT_PORT:-8000}:8000"
    depends_on:
      - waha
      - qdrant
